# po4a configuration for translating the PreTeXt source of
# "Discrete Mathematics: An Open Introduction" into Greek (el).
#
# Design notes (tag categorization for the PreTeXt XML dialect):
#  - inline: <m> (inline math), <var> (inline variable name), <em>, <term>,
#    <q>, <url>, <email>, <xref>, <attr> stay inside the flow of the
#    enclosing paragraph, so translators see them in natural context.
#  - placeholder: <fn> (footnotes) get their own PO entry but don't break
#    the surrounding paragraph's string.
#  - untranslated: <idx>/<h> (index terms), <me>/<md>/<mrow> (display math),
#    <latex-image> (raw TikZ source), <webwork>/<pg-code> (WeBWorK problem
#    code), <macros>/<latex-image-preamble> (raw LaTeX macros), <clearpage>,
#    <ellipsis> are copied through verbatim and never shown to translators.
#  - everything else defaults to translated/wrap ("w"), so block content
#    (<p>, <title>, <statement>, <exercise>, <theorem>, ... and any tag not
#    explicitly listed below) is recursed into and extracted normally.

[po4a_langs] el
[po4a_paths] l10n/pot/book.pot $lang:l10n/po/$lang/book.po

[po4a_alias:ptx] xml opt:"-o nostrip -o foldattributes -o inline=\"<em> <term> <q> <url> <email> <attr> <m> <var> <xref>\" -o placeholder=\"<fn>\" -o untranslated=\"<idx> <h> <me> <md> <mrow> <latex-image> <webwork> <pg-code> <macros> <latex-image-preamble> <clearpage> <ellipsis>\" -o defaulttranslateoption=w"

